<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo credits</title>
<link rel="stylesheet" href="/common.css">
<style>
  body { padding: 20px 16px 60px; max-width: 760px; margin: auto; }
  .c { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .c img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex: none; }
  .c .t { font-weight: 700; } .c .m { font-size: 12.5px; color: var(--mute); word-break: break-word; }
</style>
</head>
<body>
<p><a href="javascript:history.back()">← Back</a></p>
<h1>Photo credits</h1>
<p class="mute">Dish photos come from Wikimedia Commons and are used under their open licences (CC BY, CC BY-SA or CC0). Thank you to the photographers.</p>
<div id="list"></div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https:\/\/(commons\.wikimedia\.org|creativecommons\.org)\//.test(u || '') ? u : '';
Promise.all([fetch('/api/menu').then(r => r.json()), fetch('/img/credits.json').then(r => r.json())]).then(([menu, credits]) => {
  document.getElementById('list').innerHTML = menu.items.filter(i => credits[i.id]).map(i => {
    const c = credits[i.id], lic = safeUrl(c.licenseUrl), page = safeUrl(c.page);
    return `<div class="c"><img src="/img/${esc(i.id)}.jpg" alt="" loading="lazy"><div><div class="t">${esc(i.name)}</div>
      <div class="m">“${page ? `<a href="${esc(page)}" rel="noopener">${esc(c.file)}</a>` : esc(c.file)}” by ${esc(c.author)} · ${lic ? `<a href="${esc(lic)}" rel="noopener">${esc(c.license)}</a>` : esc(c.license)}</div></div></div>`;
  }).join('');
});
</script>
</body>
</html>
